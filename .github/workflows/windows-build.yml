# Windows でのビルド確認（手動実行）。Actions タブ →「Windows build check」→ Run workflow
# 目的：手元の Windows 実機が無くても、OpenSSL（SQLCipher用）のソースビルドと Rust のテストが
#       Windows で通るかを、GitHub の Windows 環境で確かめる。※ 作成時点では未実行（未検証）
name: Windows build check
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"        # Windows の既定の文字コードでは、日本語の出力で落ちるため
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Perl と NASM を確認（OpenSSLのソースビルドに使う）
        run: |
          choco install nasm strawberryperl -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NASM"
        continue-on-error: true
      - name: 版の表示
        run: |
          rustc --version; cargo --version
          perl -v | Select-Object -First 2
          nasm -v

      - name: Rust のテスト（OpenSSL をソースから同梱）
        working-directory: rust/ibis-core
        run: cargo test --features vendored-openssl 2>&1 | Tee-Object -FilePath ..\..\rust-test.log

      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: DB のテスト（暗号化なし）
        run: python db/tests/run_tests.py 2>&1 | Tee-Object -FilePath db-test.log
      - name: 暗号化のテスト（sqlcipher3-wheels が Windows 用に提供されている場合）
        run: |
          pip install -r db/requirements.txt
          cmd /c "python -X faulthandler -u db\tests\run_with_big_stack.py db\tests\test_encryption.py -v > enc-test.log 2>&1"
          Write-Host "python exit code = $LASTEXITCODE"
          Get-Content enc-test.log -Encoding UTF8
        continue-on-error: true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-build-logs
          path: |
            rust-test.log
            db-test.log
            enc-test.log
