version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 3
  - package-ecosystem: "cargo"
    directory: "/rust/ibis-core"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 3
    ignore:
      # 暗号化DB（SQLCipher）の版・操作ログのハッシュ形式を決める中核のため、自動では上げない。
      # 上げるときは、PythonとRustの相互運用テスト（db/tests/cross_check.py）で互換性を確認してから、手動で行う。
      # 見直しは四半期ごと（docs/git-workflow.md「依存ライブラリの更新」）
      - dependency-name: "rusqlite"
      - dependency-name: "sha2"
      - dependency-name: "rand"
  - package-ecosystem: "npm"
    directory: "/app"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 3
  - package-ecosystem: "pip"
    directory: "/db"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 3
